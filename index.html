<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Arnak Game Night Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#241a1a;
  --parchment:#f2e6c8;
  --parchment-dim:#e8d7ac;
  --parchment-line:#d8c48f;
  --card:#fbf4e0;
  --gold:#c99a3a;
  --gold-dark:#9c7223;
  --forest:#3c6e47;
  --forest-dark:#254730;
  --terracotta:#b1502f;
  --terracotta-dark:#8a3c22;
  --stone:#4a3a52;
  --danger:#a13327;
  --muted:#8a7a5c;
  --shadow: 0 4px 14px rgba(36,26,26,.18);
  --radius: 10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 500px at 20% -10%, #3a4a35 0%, transparent 60%),
    radial-gradient(1000px 400px at 100% 0%, #4a3a52 0%, transparent 55%),
    var(--ink);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  padding-bottom:76px;
}
::selection{background:var(--gold);color:#241a1a;}
h1,h2,h3,.display{font-family:'Cinzel',serif; letter-spacing:.02em;}
.mono, .num{font-variant-numeric: tabular-nums; font-feature-settings:"tnum";}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---- Header ---- */
header.top{
  background:linear-gradient(180deg,#2e2320,#241a1a 85%);
  border-bottom:3px solid var(--gold-dark);
  padding:14px 16px 10px;
  position:sticky; top:0; z-index:40;
}
.brand{display:flex;align-items:center;gap:12px;max-width:1180px;margin:0 auto;}
.brand img{height:46px;width:auto;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
.brand .sub{color:#d9c99a;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-family:'Inter';margin-top:2px;}
.brand-text{display:flex;flex-direction:column;}
.brand-text .name{color:#f2e6c8;font-size:13px;font-family:'Cinzel';letter-spacing:.08em;}

nav.tabs{
  max-width:1180px;margin:12px auto 0; display:flex; gap:4px; flex-wrap:wrap;
}
nav.tabs button{
  background:transparent;border:1px solid transparent;color:#cbb98c;
  padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;
  letter-spacing:.02em;
}
nav.tabs button:hover{background:rgba(201,154,58,.12);}
nav.tabs button.active{background:var(--gold);color:#241a1a;border-color:var(--gold-dark);}

/* mobile bottom nav */
nav.bottom{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:#241a1a;border-top:3px solid var(--gold-dark);
  padding:6px 4px 8px;
}
nav.bottom .row{display:flex;justify-content:space-around;max-width:640px;margin:0 auto;}
nav.bottom button{
  background:none;border:none;color:#a8987a;display:flex;flex-direction:column;
  align-items:center;gap:2px;font-size:10px;font-weight:600;padding:4px 6px;border-radius:8px;
}
nav.bottom button .ic{font-size:18px;}
nav.bottom button.active{color:var(--gold);}

/* ---- Layout ---- */
main{max-width:1180px;margin:0 auto;padding:20px 16px 40px;}
.grid{display:grid;gap:16px;}
.cols-2{grid-template-columns:1fr 1fr;}
.cols-3{grid-template-columns:repeat(3,1fr);}
.cols-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:860px){.cols-2,.cols-3,.cols-4{grid-template-columns:1fr;}}

.card{
  background:var(--card);
  border:1px solid var(--parchment-line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
}
.card h2{margin:0 0 4px;font-size:19px;color:var(--forest-dark);}
.card h3{margin:0 0 10px;font-size:15px;color:var(--stone);}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px;}
.stat-big{font-family:'Cinzel';font-size:34px;color:var(--terracotta-dark);line-height:1;}
.stat-label{font-size:12px;color:var(--muted);margin-top:4px;}
.muted{color:var(--muted);}
.divider{height:1px;background:var(--parchment-line);margin:14px 0;}

.btn{
  display:inline-flex;align-items:center;gap:6px;justify-content:center;
  background:var(--forest);color:#f2e6c8;border:1px solid var(--forest-dark);
  padding:10px 16px;border-radius:8px;font-weight:700;font-size:14px;
}
.btn:hover{background:var(--forest-dark);}
.btn.gold{background:var(--gold);color:#241a1a;border-color:var(--gold-dark);}
.btn.gold:hover{background:var(--gold-dark);color:#fff;}
.btn.outline{background:transparent;color:var(--forest-dark);border:1px solid var(--forest);}
.btn.outline:hover{background:rgba(60,110,71,.08);}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn.danger:hover{background:rgba(161,51,39,.08);}
.btn.sm{padding:6px 10px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.03em;}
.pill.scheduled{background:#e9dfc0;color:#7a5f22;border:1px solid var(--gold-dark);}
.pill.in_progress{background:#dce9df;color:var(--forest-dark);border:1px solid var(--forest);}
.pill.completed{background:#e3d8ee;color:var(--stone);border:1px solid var(--stone);}
.pill.cancelled{background:#f0d9d4;color:var(--danger);border:1px solid var(--danger);}

.swatch{width:13px;height:13px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,.25);vertical-align:-1px;}
.c-red{background:#c0392b;} .c-yellow{background:#e0b02c;} .c-green{background:#2f9e44;} .c-blue{background:#2b73b8;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--parchment-line);}
td{padding:8px 8px;border-bottom:1px solid var(--parchment-line);}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}
tr.me-row td{background:rgba(201,154,58,.10);}

label{display:block;font-size:12px;font-weight:700;color:var(--stone);margin-bottom:4px;}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--parchment-line);border-radius:7px;
  background:#fffdf6;font-size:14px;color:var(--ink);
}
input[type=checkbox]{width:16px;height:16px;}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;}
.field{margin-bottom:12px;}
.row-icon{height:30px;width:auto;vertical-align:middle;border-radius:4px;margin-right:6px;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.chip-select{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  border:1px solid var(--parchment-line);background:#fffdf6;padding:8px 12px;border-radius:8px;
  font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;
}
.chip.on{background:var(--forest);color:#fff;border-color:var(--forest-dark);}
.chip input{display:none;}

.setup-table th,.setup-table td{text-align:left;}
.icon{font-size:16px;margin-right:4px;}

.score-ledger{border:1px solid var(--parchment-line);border-radius:8px;overflow:hidden;background:#fffdf6;}
.score-row{display:grid;grid-template-columns:150px 1fr;align-items:center;border-bottom:1px dashed var(--parchment-line);}
.score-row:last-child{border-bottom:none;}
.score-row .lbl{padding:9px 10px;font-size:12.5px;font-weight:700;color:var(--stone);display:flex;align-items:center;gap:6px;background:#f6ecd2;}
.score-row .inputs{display:flex;gap:1px;background:var(--parchment-line);}
.score-row .inputs > div{flex:1;background:#fffdf6;padding:6px;}
.score-row input{border:none;background:transparent;padding:4px 2px;font-size:14px;text-align:center;}
.score-row input:focus{outline:2px solid var(--gold);border-radius:4px;}
.score-total-row{display:grid;grid-template-columns:150px 1fr;background:#efe0b8;}
.score-total-row .lbl{padding:10px;font-weight:800;color:var(--terracotta-dark);background:transparent;}
.score-total-row .inputs{display:flex;}
.score-total-row .inputs>div{flex:1;text-align:center;padding:10px 4px;font-family:'Cinzel';font-size:17px;color:var(--terracotta-dark);font-weight:700;}
.player-head{display:flex;flex:1;text-align:center;padding:8px 4px;font-size:12.5px;font-weight:800;color:var(--forest-dark);border-right:1px solid var(--parchment-line);}
.player-head:last-child{border-right:none;}
.player-heads{display:flex;background:#f6ecd2;border-bottom:2px solid var(--parchment-line);}
.player-heads > div{flex:1;}

.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-state .big{font-size:38px;margin-bottom:8px;}

.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.filter-row select, .filter-row input{width:auto;}

.modal-bg{position:fixed;inset:0;background:rgba(24,17,17,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:var(--parchment);border-radius:12px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:22px;border:2px solid var(--gold-dark);box-shadow:0 20px 60px rgba(0,0,0,.4);}

.share-box{background:#1f2a1f;color:#eae0c0;border-radius:8px;padding:14px;font-size:13px;white-space:pre-wrap;font-family:'Spectral',serif;line-height:1.5;max-height:260px;overflow:auto;}

.tag-row{display:flex;gap:6px;flex-wrap:wrap;}
.small{font-size:12px;}
.right{text-align:right;}
.center{text-align:center;}

.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.subtabs button{background:transparent;border:1px solid var(--parchment-line);padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:700;color:var(--stone);}
.subtabs button.active{background:var(--stone);color:#fff;border-color:var(--stone);}

.hof-year{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--parchment-line);}
.hof-year:last-child{border-bottom:none;}
.hof-medal{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #f3da8a, var(--gold-dark));display:flex;align-items:center;justify-content:center;font-family:'Cinzel';font-weight:800;color:#3a2a08;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.3);}

footer{max-width:1180px;margin:30px auto 0;padding:16px;color:#a8987a;font-size:11.5px;text-align:center;}
@media(max-width:860px){
  nav.tabs{display:none;}
  nav.bottom{display:block;}
  body{padding-bottom:84px;}
}
</style>
</head>

function mapName(id){ return (MAPS.find(m=>m.id===id)||{}).name || '—'; }
function trackName(id){ return (TRACKS.find(t=>t.id===id)||{}).name || '—'; }

let players = [];
let games = [];
let settings = { expansions:{leaders:true, missing:false, twisted:false}, points:{1:5,2:3,3:2,4:1}, variants:{prospector:false, traveler:false} };
let state = { tab:'dashboard', newGame:null, activeGameId:null, analyticsSub:'player', analyticsPlayer:null, leaderboardPeriod:'current', analyticsPeriod:'current' };

const uid = ()=> (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2));
const num = v => { const n = Number(v); return isNaN(n) ? 0 : n; };
const thisYear = () => new Date().getFullYear();
const todayStr = () => new Date().toISOString().slice(0,10);
const fmtDate = d => { const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}); };
const activePlayers = () => players.filter(p=>p.active);
const playerName = id => (players.find(p=>p.id===id)||{}).name || '(removed player)';

/* =========================================================
   STORAGE — GitHub-backed shared storage
   This build stores all data (players, games, settings) as one JSON file
   committed to a GitHub repo, read/written via the GitHub REST API. Every
   save is a git commit, so there's automatic version history for free.
   Connection details (owner/repo/path/branch/token) are entered once per
   browser via the setup screen below and kept in localStorage — this is a
   normal static site now (not a Claude artifact), so localStorage is fine.
========================================================= */
const GH_CFG_KEY = 'arnak_gh_config';
let ghConfig = null;   // {owner, repo, path, branch, token}
let ghSha = null;      // current file SHA, needed to commit updates

function loadGhConfig(){
  try{ const raw = localStorage.getItem(GH_CFG_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function saveGhConfig(cfg){
  ghConfig = cfg;
  localStorage.setItem(GH_CFG_KEY, JSON.stringify(cfg));
}
function ghApiUrl(cfg){
  return `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURIComponent(cfg.path)}`;
}
function b64EncodeUnicode(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUnicode(str){
  return decodeURIComponent(escape(atob(str.replace(/\n/g,''))));
}
async function ghGetFile(cfg){
  const res = await fetch(`${ghApiUrl(cfg)}?ref=${encodeURIComponent(cfg.branch||'main')}&_=${Date.now()}`, {
    headers: { Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github+json' }
  });
  if(res.status===404) return { data:null, sha:null };
  if(!res.ok) throw new Error(`GitHub read failed (${res.status})`);
  const json = await res.json();
  const content = b64DecodeUnicode(json.content);
  return { data: JSON.parse(content), sha: json.sha };
}
async function ghPutFile(cfg, obj, sha, message){
  const res = await fetch(ghApiUrl(cfg), {
    method:'PUT',
    headers: { Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github+json', 'Content-Type':'application/json' },
    body: JSON.stringify({
      message: message || 'Update Arnak tracker data',
      content: b64EncodeUnicode(JSON.stringify(obj, null, 2)),
      branch: cfg.branch || 'main',
      ...(sha ? {sha} : {}),
    })
  });
  if(res.status===409){ const err = new Error('conflict'); err.conflict = true; throw err; }
  if(!res.ok){ const t = await res.text(); throw new Error(`GitHub write failed (${res.status}): ${t}`); }
  const json = await res.json();
  return json.content.sha;
}

function defaultSettings(){
  return {expansions:{leaders:true,missing:false,twisted:false}, points:{1:5,2:3,3:2,4:1}, variants:{prospector:false,traveler:false}};
}

/* A one-click "setup link" lets you share owner/repo/path/branch/token as a
   URL fragment instead of dictating each field by hand. Fragments are never
   sent over the network (not in the request line, not in Referer headers to
   any origin), so this is no less safe than the token living in the app's
   own JS — but still share it privately, never post it somewhere public. */
function parseConnectHash(){
  const m = location.hash.match(/^#\/connect\?(.*)$/);
  if(!m) return null;
  const params = new URLSearchParams(m[1]);
  const cfg = {
    owner: params.get('owner')||'', repo: params.get('repo')||'',
    path: params.get('path')||'data.json', branch: params.get('branch')||'main',
    token: params.get('token')||'',
  };
  history.replaceState(null, '', location.pathname + location.search); // scrub it from the address bar right away
  return cfg;
}
function buildSetupLink(cfg){
  if(!cfg) return '';
  const params = new URLSearchParams({owner:cfg.owner, repo:cfg.repo, path:cfg.path, branch:cfg.branch, token:cfg.token});
  return location.origin + location.pathname + '#/connect?' + params.toString();
}
function copySetupLink(){
  const link = buildSetupLink(ghConfig);
  if(!link){ showAlert('Connect this browser first.'); return; }
  const done = ()=> showAlert('Setup link copied! Share it privately (DM, not a public channel) — it carries full write access to your data repo.');
  navigator.clipboard?.writeText(link).then(done).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=link; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); done();
  });
}

async function loadAll(){
  ghConfig = loadGhConfig();
  const hashCfg = parseConnectHash();
  if(!ghConfig){ renderGhSetup(hashCfg || undefined); return; }
  const statusEl = document.getElementById('syncStatus');

    const { data, sha } = await ghGetFile(ghConfig);
    ghSha = sha;
    players = data?.players || [];
    games = data?.games || [];
    settings = Object.assign(defaultSettings(), data?.settings||{});
    if(statusEl) statusEl.textContent = 'Synced · shared via GitHub';
  }catch(e){
    console.error(e);
    if(statusEl) statusEl.textContent = 'Could not reach GitHub — check connection settings';
  }
}

/* All three save* functions commit the same combined file — simplest way
   to avoid three separate git histories / merge headaches. Retries once
   on a 409 conflict (someone else saved in between) by re-reading the
   latest SHA and re-committing on top of it (last write wins). */
async function ghSaveAll(){
  if(!ghConfig) return;
  const payload = { players, games, settings };
  try{
    ghSha = await ghPutFile(ghConfig, payload, ghSha);
  }catch(e){
    if(e.conflict){
      try{
        const { sha } = await ghGetFile(ghConfig);
        ghSha = await ghPutFile(ghConfig, payload, sha, 'Update Arnak tracker data (retry after conflict)');
      }catch(e2){ console.error('GitHub save retry failed', e2); }
    } else {
      console.error('GitHub save failed', e);
    }
  }
}
async function savePlayers(){ await ghSaveAll(); }
async function saveGames(){ await ghSaveAll(); }
async function saveSettings(){ await ghSaveAll(); }

/* =========================================================
   CONTENT HELPERS (respect enabled expansions)
========================================================= */
function enabledMaps(){ return MAPS.filter(m=> m.exp==='base' || settings.expansions[m.exp]); }
function enabledTracks(){ return TRACKS.filter(t=> t.exp==='base' || settings.expansions[t.exp]); }
function enabledLeaders(){ return LEADERS.filter(l=> l.variant ? settings.variants[l.id] : settings.expansions[l.exp]); }
function compatTracksFor(mapId){
  const allowed = COMPAT[mapId]||[];
  const en = enabledTracks().map(t=>t.id);
  return allowed.filter(id=>en.includes(id));
}

/* =========================================================
   RANDOMIZER
========================================================= */
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* Weighted lottery: picks one index from items, favoring lower weights less.
   Plain proportional-to-weight random pick — not deterministic. */
function weightedPick(weights){
  const total = weights.reduce((a,b)=>a+b,0);
  if(total<=0) return Math.floor(Math.random()*weights.length);
  let r = Math.random()*total;
  for(let i=0;i<weights.length;i++){
    r -= weights[i];
    if(r<=0) return i;
  }
  return weights.length-1;
}

/* Tally how often each of the given players has previously held each
   position / color / leader / board, across every non-cancelled game on record. */
function playerHistoryCounts(playerIds){
  const relevant = games.filter(g=> g.status!=='cancelled');
  const counts = {};
  playerIds.forEach(pid=> counts[pid] = {position:{}, color:{}, leader:{}, map:{}, track:{}});
  relevant.forEach(g=> g.players.forEach(gp=>{
    const c = counts[gp.playerId]; if(!c) return;
    c.position[gp.order] = (c.position[gp.order]||0)+1;
    c.color[gp.color] = (c.color[gp.color]||0)+1;
    const lk = gp.leaderId || 'none';
    c.leader[lk] = (c.leader[lk]||0)+1;
    c.map[g.mapId] = (c.map[g.mapId]||0)+1;
    c.track[g.researchTrackId] = (c.track[g.researchTrackId]||0)+1;
  }));
  return counts;
}

/* Assigns each player one option from `options` (1:1), weighting the lottery
   so a player who has rarely/never had a given option is more likely (not
   guaranteed) to get it this time. Processing order is shuffled so no player
   is systematically favored. Falls back to null when options run out. */
function balancedAssign(playerIds, options, countFn){
  const remaining = [...options];
  const order = shuffle(playerIds);
  const result = {};
  order.forEach(pid=>{
    if(remaining.length===0){ result[pid]=null; return; }
    const weights = remaining.map(opt => 1/((countFn(pid,opt)||0)+1));
    const idx = weightedPick(weights);
    result[pid] = remaining[idx];
    remaining.splice(idx,1);
  });
  return result;
}

/* Picks one shared option (e.g. a board) for the whole table, weighting
   toward whichever option this specific group of players has collectively
   played the least — still a genuine random draw, not deterministic. */
function balancedGroupPick(playerIds, options, countFn){
  const weights = options.map(opt=>{
    const avg = playerIds.reduce((sum,pid)=> sum + (countFn(pid,opt)||0), 0) / playerIds.length;
    return 1/(avg+1);
  });
  return options[weightedPick(weights)];
}

function randomizeSetup(cfg){
  // cfg: {playerIds, leaderMode:'random'|'manual'|'none', manualLeaders:{playerId:leaderId},
  //       boardMode:'random'|'manual', manualMapId, manualTrackId, randomStyle:'standard'|'balanced'}
  const balanced = cfg.randomStyle==='balanced';
  const counts = balanced ? playerHistoryCounts(cfg.playerIds) : null;

  let order;
  if(balanced){
    const posOptions = cfg.playerIds.map((_,i)=>i+1);
    const posAssign = balancedAssign(cfg.playerIds, posOptions, (pid,opt)=> counts[pid].position[opt]);
    order = [...cfg.playerIds].sort((a,b)=> posAssign[a]-posAssign[b]);
  } else {
    order = shuffle(cfg.playerIds);
  }

  let colorAssign = {};
  if(balanced){
    colorAssign = balancedAssign(order, COLORS.slice(0, order.length), (pid,opt)=> counts[pid].color[opt]);
  } else {
    const colorPool = shuffle(COLORS).slice(0, order.length);
    order.forEach((pid,i)=> colorAssign[pid]=colorPool[i]);
  }

  let leaderAssign = {};
  if(cfg.leaderMode==='random'){
    const pool = enabledLeaders().map(l=>l.id);
    if(balanced){
      leaderAssign = balancedAssign(order, pool, (pid,opt)=> counts[pid].leader[opt]);
    } else {
      const shuffled = shuffle(pool);
      order.forEach((pid,i)=> leaderAssign[pid] = shuffled[i] || null);
    }
  } else if(cfg.leaderMode==='manual'){
    leaderAssign = cfg.manualLeaders || {};
  } else {
    order.forEach(pid=> leaderAssign[pid]=null);
  }
  let mapId, trackId;
  if(cfg.boardMode==='manual'){
    mapId = cfg.manualMapId;
    trackId = MAPS.find(m=>m.id===mapId)?.integratedTrack || cfg.manualTrackId;
  } else {
    const maps = enabledMaps();
    if(balanced){
      mapId = balancedGroupPick(cfg.playerIds, maps.map(m=>m.id), (pid,opt)=> counts[pid].map[opt]);
    } else {
      mapId = shuffle(maps)[0]?.id;
    }
    const map = MAPS.find(m=>m.id===mapId);
    if(map.integratedTrack){ trackId = map.integratedTrack; }
    else { const opts = compatTracksFor(mapId); trackId = balanced ? balancedGroupPick(cfg.playerIds, opts, (pid,opt)=> counts[pid].track[opt]) : shuffle(opts)[0]; }
  }
  const playersOut = order.map((pid,i)=>({
    playerId: pid, order: i+1, color: colorAssign[pid], leaderId: leaderAssign[pid] || null,
    researchVP:0, templeVP:0, idolVP:0, guardianVP:0, cardVP:0, fearPenalty:0,
    finalScore:null, finishPos:null, leaguePoints:0
  }));
  return { mapId, researchTrackId: trackId, players: playersOut };
}

/* =========================================================
   SCORING
   Mirrors the physical score pad: one direct VP entry per row
   (Research combines magnifying glass + notebook; Temple Tiles,
   Idols, Items/Artifacts and Fear are each a single total the
   player works out and writes in, same as on paper). Guardians
   stays a simple count since it's always exactly 5 VP each.
========================================================= */
function calcScores(gp){
  const researchVP = num(gp.researchVP);
  const templeVP = num(gp.templeVP);
  const idolVP = num(gp.idolVP);
  const guardianVP = num(gp.guardianVP);
  const cardVP = num(gp.cardVP);
  const fearVP = -Math.abs(num(gp.fearPenalty));
  const finalScore = researchVP+templeVP+idolVP+guardianVP+cardVP+fearVP;
  return {researchVP,templeVP,idolVP,guardianVP,cardVP,fearVP,finalScore};
}

/* Compute scores + a default ranking. Ties share the top tied position and
   the following rank(s) are skipped, per the official rule. This is only a
   default — the ranking screen lets the group set positions manually. */
function computeScoresAndDefaultPositions(gpArr){
  gpArr.forEach(gp=> Object.assign(gp, calcScores(gp)));
  const sorted = [...gpArr].sort((a,b)=> b.finalScore-a.finalScore);
  let pos=1;
  sorted.forEach((gp,i)=>{
    if(i>0 && sorted[i-1].finalScore!==gp.finalScore) pos=i+1;
    gp.finishPos = pos;
  });
  return sorted;
}
function awardLeaguePoints(gpArr){
  const pts = settings.points;
  gpArr.forEach(gp=> gp.leaguePoints = num(pts[gp.finishPos]) || 0);
}

/* =========================================================
   DERIVED DATA / ANALYTICS HELPERS
========================================================= */
function completedGames(period){
  return games.filter(g=> g.status==='completed' && (period==='all' || new Date(g.playedAt+'T00:00:00').getFullYear()===Number(period)));
}
function yearsWithGames(){
  const ys = new Set(games.filter(g=>g.status==='completed').map(g=> new Date(g.playedAt+'T00:00:00').getFullYear()));
  return [...ys].sort((a,b)=>b-a);
}
function resolvePeriod(p){ return p==='current' ? String(thisYear()) : p; }

function computeLeaderboard(periodRaw){
  const period = resolvePeriod(periodRaw);
  const gs = completedGames(period);
  const map = {};
  gs.forEach(g=>{
    g.players.forEach(gp=>{
      const s = map[gp.playerId] || (map[gp.playerId] = {playerId:gp.playerId, games:0,wins:0,p2:0,p3:0,p4:0,scoreSum:0,finishSum:0,points:0});
      s.games++;
      if(gp.finishPos===1) s.wins++;
      if(gp.finishPos===2) s.p2++;
      if(gp.finishPos===3) s.p3++;
      if(gp.finishPos===4) s.p4++;
      s.scoreSum += num(gp.finalScore);
      s.finishSum += num(gp.finishPos);
      s.points += num(gp.leaguePoints);
    });
  });
  return Object.values(map).map(s=>({
    ...s,
    winPct: s.games? s.wins/s.games*100 : 0,
    avgFinish: s.games? s.finishSum/s.games : 0,
    avgScore: s.games? s.scoreSum/s.games : 0,
    ptsPerGame: s.games? s.points/s.games : 0,
  })).sort((a,b)=> b.points-a.points || b.wins-a.wins || a.avgFinish-b.avgFinish);
}

function championsForYear(year){
  const lb = computeLeaderboard(String(year));
  if(!lb.length) return [];
  const top = lb[0];
  return lb.filter(r=> r.points===top.points && r.wins===top.wins && Math.abs(r.avgFinish-top.avgFinish)<0.0001);
}
function allChampionships(){
  const counts = {};
  yearsWithGames().forEach(y=>{
    championsForYear(y).forEach(c=> counts[c.playerId] = (counts[c.playerId]||0)+1 );
  });
  return counts;
}

function groupStats(periodRaw, groupFn){
  const period = resolvePeriod(periodRaw);
  const gs = completedGames(period);
  const map = {};
  gs.forEach(g=>{
    g.players.forEach(gp=>{
      const key = groupFn(gp,g);
      if(key===null || key===undefined) return;
      const s = map[key] || (map[key]={key,plays:0,wins:0,scoreSum:0,finishSum:0});
      s.plays++;
      if(gp.finishPos===1) s.wins++;
      s.scoreSum += num(gp.finalScore);
      s.finishSum += num(gp.finishPos);
    });
  });
  return Object.values(map).map(s=>({...s,
    winPct: s.plays? s.wins/s.plays*100:0,
    avgScore: s.plays? s.scoreSum/s.plays:0,
    avgFinish: s.plays? s.finishSum/s.plays:0,
  }));
}

function playerOverview(playerId, periodRaw){
  const period = resolvePeriod(periodRaw);
  const gs = completedGames(period).filter(g=> g.players.some(gp=>gp.playerId===playerId))
    .sort((a,b)=> new Date(a.playedAt)-new Date(b.playedAt));
  const rows = gs.map(g=> g.players.find(gp=>gp.playerId===playerId));
  const scores = rows.map(r=>num(r.finalScore));
  const n = rows.length;
  const wins = rows.filter(r=>r.finishPos===1).length;
  const p2 = rows.filter(r=>r.finishPos===2).length;
  const p3 = rows.filter(r=>r.finishPos===3).length;
  const p4 = rows.filter(r=>r.finishPos===4).length;
  const points = rows.reduce((a,r)=>a+num(r.leaguePoints),0);
  const avgFinish = n? rows.reduce((a,r)=>a+num(r.finishPos),0)/n : 0;
  const sortedScores = [...scores].sort((a,b)=>a-b);
  const median = n? (n%2? sortedScores[(n-1)/2] : (sortedScores[n/2-1]+sortedScores[n/2])/2) : 0;
  // streaks (based on all completed games chronologically, ignoring period, for "current" streak feel All Time is more accurate — use same period set)
  let curWin=0,curPodium=0,longWin=0,longPodium=0,runW=0,runP=0;
  rows.forEach(r=>{
    if(r.finishPos===1){ runW++; } else runW=0;
    if(r.finishPos<=2){ runP++; } else runP=0;
    longWin=Math.max(longWin,runW); longPodium=Math.max(longPodium,runP);
  });
  curWin = runW; curPodium = runP;
  return {
    playerId, games:n, wins, p2, p3, p4,
    winPct: n? wins/n*100:0, avgFinish, points, ptsPerGame: n? points/n:0,
    avgScore: n? scores.reduce((a,b)=>a+b,0)/n:0, median,
    high: n? Math.max(...scores):0, low: n? Math.min(...scores):0,
    championships: (allChampionships()[playerId])||0,
    curWin, curPodium, longWin, longPodium,
  };
}

/* =========================================================
   SHARE TEXT
========================================================= */
function shareTextForGame(game){
  const rows = [...game.players].sort((a,b)=>a.order-b.order);
  const lines = [];
  lines.push('*Lost Ruins of Arnak — Game Night*');
  lines.push(fmtDate(game.playedAt));
  lines.push('');
  rows.forEach(gp=>{
    lines.push(`${gp.order}. ${playerName(gp.playerId)} — ${COLOR_LABEL[gp.color]}${gp.leaderId? ' · '+leaderName(gp.leaderId) : ' · No Leader'}`);
  });
  lines.push('');
  lines.push(`Map: ${mapName(game.mapId)}`);
  lines.push(`Research: ${trackName(game.researchTrackId)}`);
  lines.push('');
  const link = gameLink(game.id);
  lines.push(link ? `Full details: ${link}` : `Open the tracker app to see full details for ${fmtDate(game.playedAt)}.`);
  return lines.join('\n');
}
function gameLink(id){
  try{
    const origin = location.origin;
    const bad = !origin || origin==='null' || location.href.startsWith('about:') || location.href.includes('srcdoc');
    if(bad) return null;
    return origin + location.pathname + '#/game/' + id;
  }catch(e){ return null; }
}

function render(){
  renderNav();
  const app = document.getElementById('app');
  if(state.tab==='dashboard') app.innerHTML = renderDashboard();
  else if(state.tab==='newgame') app.innerHTML = renderNewGame();
  else if(state.tab==='games') app.innerHTML = renderGames();
  else if(state.tab==='players') app.innerHTML = renderPlayers();
  else if(state.tab==='leaderboard') app.innerHTML = renderLeaderboard();
  else if(state.tab==='analytics') app.innerHTML = renderAnalytics();
  else if(state.tab==='hof') app.innerHTML = renderHOF();
  else if(state.tab==='settings') app.innerHTML = renderSettings();
  bindTabEvents();
}

/* =========================================================
   DASHBOARD
========================================================= */
function renderDashboard(){
  const year = thisYear();
  const lb = computeLeaderboard('current').slice(0,5);
  const gs = completedGames(String(year));
  const scheduled = games.filter(g=>g.status==='scheduled').sort((a,b)=> new Date(a.playedAt)-new Date(b.playedAt));
  const inProgress = games.filter(g=>g.status==='in_progress');
  const lastCompleted = [...games].filter(g=>g.status==='completed').sort((a,b)=> new Date(b.playedAt)-new Date(a.playedAt))[0];
  const mostWins = [...lb].sort((a,b)=>b.wins-a.wins)[0];
  const highest = gs.flatMap(g=>g.players.map(gp=>({...gp,date:g.playedAt}))).sort((a,b)=>b.finalScore-a.finalScore)[0];

  return `
  <div class="grid cols-3" style="margin-bottom:16px;">
    <div class="card" style="grid-column:span 1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:10px;">
      <div class="eyebrow">Ready to play?</div>
      <h2 style="margin:0;">Start a game night</h2>
      <button class="btn gold" onclick="goTab('newgame')">🎲 New Game</button>
    </div>
    <div class="card">
      <div class="eyebrow">${year} Season</div>
      <div class="stat-big">${gs.length}</div>
      <div class="stat-label">games played this year</div>
    </div>
    <div class="card">
      <div class="eyebrow">Top of the table</div>
      <div class="stat-big" style="font-size:22px;">${mostWins? playerName(mostWins.playerId): '—'}</div>
      <div class="stat-label">${mostWins? mostWins.points+' league pts · '+mostWins.wins+' wins' : 'no games yet'}</div>
    </div>
  </div>

  ${scheduled.length ? `
  <div class="card" style="margin-bottom:16px;">
    <h2>📣 Upcoming (pre-generated) games</h2>
    <p class="muted small">Setup is locked and shared — anyone can open a game below to see the full details or start play.</p>
    ${scheduled.map(g=>renderScheduledRow(g)).join('')}
  </div>` : ''}

  ${inProgress.length ? `
  <div class="card" style="margin-bottom:16px;">
    <h2>▶️ In progress</h2>
    ${inProgress.map(g=>`
      <div class="tag-row" style="justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--parchment-line);">
        <div><strong>${fmtDate(g.playedAt)}</strong> — ${mapName(g.mapId)} · ${g.players.length} players</div>
        <div class="btn-row">
          <button class="btn sm outline" onclick="openGameDetail('${g.id}')">Open</button>
          <button class="btn sm" onclick="openGameForScoring('${g.id}')">Enter results</button>
        </div>
      </div>`).join('')}
  </div>` : ''}

  ${activePlayers().length ? `
  <div class="card" style="margin-bottom:16px;">
    <h2>Recent form</h2>
    <p class="muted small">Last 5 finishes per player, oldest → newest.</p>
    <div class="table-wrap"><table>
      <tr><th>Player</th><th>Form</th></tr>
      ${activePlayers().map(p=>`<tr><td>${p.name}</td><td>${renderFormBadges(recentForm(p.id))}</td></tr>`).join('')}
    </table></div>
  </div>` : ''}

  <div class="grid cols-2">
    <div class="card">
      <h2>${year} Leaderboard</h2>
      ${lb.length ? `
      <div class="table-wrap"><table>
        <tr><th>#</th><th>Player</th><th>Pts</th><th>W</th><th>Games</th></tr>
        ${lb.map((r,i)=>`<tr><td>${i+1}</td><td>${playerName(r.playerId)}</td><td class="num"><strong>${r.points}</strong></td><td class="num">${r.wins}</td><td class="num">${r.games}</td></tr>`).join('')}
      </table></div>
      <div style="margin-top:10px;"><button class="btn outline sm" onclick="goTab('leaderboard')">Full leaderboard →</button></div>
      ` : `<div class="empty-state small">No completed games yet this year.</div>`}
    </div>
    <div class="card">
      <h2>Recent highlights</h2>
      <table>
        <tr><td class="muted">Last game</td><td>${lastCompleted? fmtDate(lastCompleted.playedAt)+' · winner '+playerName([...lastCompleted.players].sort((a,b)=>a.finishPos-b.finishPos)[0].playerId) : '—'}</td></tr>
        <tr><td class="muted">Highest score (${year})</td><td>${highest? highest.finalScore+' pts — '+playerName(highest.playerId) : '—'}</td></tr>
        <tr><td class="muted">Active players</td><td>${activePlayers().length}</td></tr>
      </table>
      <div style="margin-top:10px;"><button class="btn outline sm" onclick="goTab('hof')">Hall of Fame →</button></div>
    </div>
  </div>
  `;
}

function recentForm(pid, count){
  count = count || 5;
  return games.filter(g=>g.status==='completed' && g.players.some(p=>p.playerId===pid))
    .sort((a,b)=> new Date(b.playedAt)-new Date(a.playedAt))
    .slice(0,count)
    .map(g=> g.players.find(p=>p.playerId===pid).finishPos)
    .reverse();
}
function renderFormBadges(arr){
  if(!arr.length) return '<span class="muted small">No games yet</span>';
  const badgeColor = {1:'#c99a3a',2:'#9aa5ad',3:'#b1652f',4:'#8a7a5c'};
  return arr.map(pos=>`<span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:${badgeColor[pos]||'#8a7a5c'};color:#fff;font-size:11px;font-weight:800;margin-right:4px;">${pos}</span>`).join('');
}
function renderScheduledRow(g){
  return `
  <div style="padding:10px 0;border-bottom:1px solid var(--parchment-line);">
    <div class="tag-row" style="justify-content:space-between;align-items:center;">
      <div><strong>${fmtDate(g.playedAt)}</strong> · ${g.players.length} players · ${mapName(g.mapId)}
        <div class="small muted">${g.players.sort((a,b)=>a.order-b.order).map(gp=>playerName(gp.playerId)).join(', ')}</div>
      </div>
      <div class="btn-row"><button class="btn sm outline" onclick="openGameDetail('${g.id}')">View / Share</button></div>
    </div>
  </div>`;
}

/* =========================================================
   PLAYERS
========================================================= */
function renderPlayers(){
  return `
  <div class="card" style="margin-bottom:16px;">
    <h2>Add a player</h2>
    <div class="tag-row">
      <input type="text" id="newPlayerName" placeholder="Player name" style="max-width:260px;">
      <button class="btn" onclick="addPlayer()">+ Add player</button>
    </div>
  </div>
  <div class="card">
    <h2>Roster</h2>
    <div class="table-wrap"><table>
      <tr><th>Name</th><th>Status</th><th>Games (all time)</th><th></th></tr>
      ${players.length? players.map(p=>{
        const games_ = completedGames('all').filter(g=>g.players.some(gp=>gp.playerId===p.id)).length;
        return `<tr>
          <td>${p.name}</td>
          <td><span class="pill ${p.active?'in_progress':'cancelled'}">${p.active?'Active':'Inactive'}</span></td>
          <td class="num">${games_}</td>
          <td class="btn-row">
            <button class="btn sm outline" onclick="renamePlayer('${p.id}')">Rename</button>
            <button class="btn sm ${p.active?'danger':''}" onclick="togglePlayer('${p.id}')">${p.active?'Deactivate':'Reactivate'}</button>
          </td>
        </tr>`;
      }).join('') : `<tr><td colspan="4" class="empty-state">No players yet — add your group above.</td></tr>`}
    </table></div>
  </div>`;
}
async function addPlayer(){
  const input = document.getElementById('newPlayerName');
  const name = input.value.trim();
  if(!name) return;
  players.push({id:uid(), name, active:true, createdAt:new Date().toISOString()});
  await savePlayers(); render();
}
async function togglePlayer(id){
  const p = players.find(x=>x.id===id); if(!p) return;
  p.active = !p.active; await savePlayers(); render();
}
function renamePlayer(id){
  const p = players.find(x=>x.id===id); if(!p) return;
  showPrompt('Rename player', p.name, async (n)=>{
    if(n && n.trim()){ p.name = n.trim(); await savePlayers(); render(); }
  });
}

/* =========================================================
   NEW GAME
========================================================= */
function emptyNewGameState(){
  return {
    step:'select', // select -> preview
    playerIds: [], playedAt: todayStr(),
    leaderMode: settings.expansions.leaders || settings.expansions.missing ? 'random' : 'none',
    boardMode: 'random',
    randomStyle: 'standard',
    manualMapId: enabledMaps()[0]?.id || 'bird',
    manualTrackId: null,
    manualLeaders: {},
    preview: null,
  };
}
function renderNewGame(){
  const ng = state.newGame || (state.newGame = emptyNewGameState());
  if(ng.step==='preview' && ng.preview) return renderNewGamePreview(ng);

  const ap = activePlayers();
  return `
  <div class="card">
    <h2>New Game — Setup</h2>
    <p class="muted small">Select players, then randomize (or manually choose) the full table setup.</p>

    <div class="field">
      <label>Players (2–4)</label>
      <div class="chip-select">
        ${ap.length? ap.map(p=>`
          <label class="chip ${ng.playerIds.includes(p.id)?'on':''}">
            <input type="checkbox" ${ng.playerIds.includes(p.id)?'checked':''} onchange="toggleNGPlayer('${p.id}')"> ${p.name}
          </label>`).join('') : `<span class="muted small">No active players — add some in the Players tab first.</span>`}
      </div>
    </div>

    <div class="grid cols-2">
      <div class="field">
        <label>Played date</label>
        <input type="date" value="${ng.playedAt}" onchange="state.newGame.playedAt=this.value">
      </div>
      <div class="field">
        <label>Leader mode</label>
        <select onchange="state.newGame.leaderMode=this.value; render();">
          <option value="random" ${ng.leaderMode==='random'?'selected':''}>Random Leaders</option>
          <option value="manual" ${ng.leaderMode==='manual'?'selected':''}>Manual Leaders</option>
          <option value="none" ${ng.leaderMode==='none'?'selected':''}>No Leaders</option>
        </select>
      </div>
    </div>

    ${ng.leaderMode==='manual' ? `
    <div class="field">
      <label>Assign leaders manually</label>
      <div class="grid cols-2">
      ${ng.playerIds.map(pid=>`
        <div>
          <span class="small muted">${playerName(pid)}</span>
          <select onchange="setManualLeader('${pid}', this.value)">
            <option value="">— none —</option>
            ${enabledLeaders().map(l=>`<option value="${l.id}" ${ng.manualLeaders[pid]===l.id?'selected':''}>${l.name}</option>`).join('')}
          </select>
        </div>`).join('') || `<span class="small muted">Select players first.</span>`}
      </div>
    </div>` : ''}

    <div class="field">
      <label>Board / Research</label>
      <div class="tag-row" style="margin-bottom:8px;">
        <label class="chip ${ng.boardMode==='random'?'on':''}"><input type="radio" name="bm" ${ng.boardMode==='random'?'checked':''} onchange="state.newGame.boardMode='random'; render();">Randomize</label>
        <label class="chip ${ng.boardMode==='manual'?'on':''}"><input type="radio" name="bm" ${ng.boardMode==='manual'?'checked':''} onchange="state.newGame.boardMode='manual'; render();">Manual</label>
      </div>
      ${ng.boardMode==='manual' ? `
        <div class="grid cols-2">
          <div>
            <label class="small">Map</label>
            <select onchange="state.newGame.manualMapId=this.value; state.newGame.manualTrackId=null; render();">
              ${enabledMaps().map(m=>`<option value="${m.id}" ${ng.manualMapId===m.id?'selected':''}>${m.name}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="small">Research track</label>
            ${MAPS.find(m=>m.id===ng.manualMapId)?.integratedTrack ?
              `<input type="text" disabled value="${trackName(MAPS.find(m=>m.id===ng.manualMapId).integratedTrack)}">` :
              `<select onchange="state.newGame.manualTrackId=this.value">
                ${compatTracksFor(ng.manualMapId).map(tid=>`<option value="${tid}" ${ng.manualTrackId===tid?'selected':''}>${trackName(tid)}</option>`).join('')}
              </select>`
            }
          </div>
        </div>
      ` : ''}
    </div>

    <div class="field">
      <label>Randomization style</label>
      <div class="tag-row">
        <label class="chip ${ng.randomStyle==='standard'?'on':''}"><input type="radio" name="rs" ${ng.randomStyle==='standard'?'checked':''} onchange="state.newGame.randomStyle='standard'; render();">Standard Random</label>
        <label class="chip ${ng.randomStyle==='balanced'?'on':''}"><input type="radio" name="rs" ${ng.randomStyle==='balanced'?'checked':''} onchange="state.newGame.randomStyle='balanced'; render();">Balanced Random</label>
      </div>
      <p class="small muted" style="margin-top:6px;">Balanced Random weights position, color, leader, board and research track against each player's (or group's) history — someone who's rarely gone first, rarely played a given leader, or a board/track this group hasn't seen lately, is more likely (not guaranteed) to come up this time. Still random, never deterministic.</p>
    </div>

    <div class="btn-row" style="margin-top:14px;">
      <button class="btn gold" ${(ng.playerIds.length<2||ng.playerIds.length>4)?'disabled':''} onclick="doRandomize()">🎲 Randomize Setup</button>
    </div>
    ${(ng.playerIds.length<2||ng.playerIds.length>4) ? `<p class="small muted" style="margin-top:8px;">Pick between 2 and 4 players to continue.</p>`:''}
  </div>`;
}
function toggleNGPlayer(pid){
  const ng = state.newGame;
  const i = ng.playerIds.indexOf(pid);
  if(i>=0) ng.playerIds.splice(i,1);
  else { if(ng.playerIds.length>=4) return; ng.playerIds.push(pid); }
  render();
}
function setManualLeader(pid, val){ state.newGame.manualLeaders[pid] = val || null; }

function doRandomize(){
  const ng = state.newGame;
  if(ng.leaderMode==='manual'){
    const vals = ng.playerIds.map(pid=>ng.manualLeaders[pid]).filter(Boolean);
    if(new Set(vals).size !== vals.length){ showAlert('Each leader can only be assigned to one player — please fix the duplicate before randomizing.'); return; }
  }
  if(ng.boardMode==='manual' && !MAPS.find(m=>m.id===ng.manualMapId)?.integratedTrack && !ng.manualTrackId){
    ng.manualTrackId = compatTracksFor(ng.manualMapId)[0];
  }
  const preview = randomizeSetup({
    playerIds: ng.playerIds, leaderMode: ng.leaderMode, manualLeaders: ng.manualLeaders,
    boardMode: ng.boardMode, manualMapId: ng.manualMapId, manualTrackId: ng.manualTrackId,
    randomStyle: ng.randomStyle,
  });
  ng.preview = preview; ng.step='preview'; render();
}
function reroll(){ doRandomize(); }

function renderNewGamePreview(ng){
  const p = ng.preview;
  return `
  <div class="card">
    <h2>Setup preview</h2>
    <p class="muted small">Played date: <strong>${fmtDate(ng.playedAt)}</strong> &nbsp;·&nbsp; <strong>${ng.randomStyle==='balanced'?'Balanced Random':'Standard Random'}</strong></p>
    <div class="table-wrap">
    <table class="setup-table">
      <tr><th>Order</th><th>Player</th><th>Color</th><th>Leader</th></tr>
      ${p.players.map(gp=>`<tr>
        <td>${gp.order}</td>
        <td>${playerName(gp.playerId)}</td>
        <td><span class="swatch c-${gp.color}"></span> ${COLOR_LABEL[gp.color]}</td>
        <td>${leaderName(gp.leaderId)}</td>
      </tr>`).join('')}
    </table>
    </div>
    <div class="divider"></div>
    <p><strong>Board:</strong> ${mapName(p.mapId)} &nbsp;·&nbsp; <strong>Research Track:</strong> ${trackName(p.researchTrackId)}</p>

    <div class="btn-row" style="margin-top:10px;">
      <button class="btn outline" onclick="reroll()">🔁 Reroll</button>
      <button class="btn outline" onclick="state.newGame.step='select'; render();">← Edit players/options</button>
      <button class="btn" onclick="saveNewGame('in_progress')">▶️ Start Game Now</button>
      <button class="btn gold" onclick="saveNewGame('scheduled')">📣 Save &amp; Share (don't start yet)</button>
    </div>
  </div>`;
}
async function saveNewGame(status){
  const ng = state.newGame;
  const game = {
    id: uid(), playedAt: ng.playedAt, status,
    mapId: ng.preview.mapId, researchTrackId: ng.preview.researchTrackId,
    leaderMode: ng.leaderMode, notes:'', createdAt:new Date().toISOString(),
    players: ng.preview.players,
  };
  games.push(game);
  await saveGames();
  state.newGame = null;
  if(status==='scheduled'){ openGameDetail(game.id, true); }
  else { openGameDetail(game.id); }
}

/* =========================================================
   GAMES LIST / HISTORY
========================================================= */
function renderGames(){
  const filterYear = state.gamesFilterYear || 'all';
  const filterStatus = state.gamesFilterStatus || 'all';
  const years = yearsWithGames();
  let list = [...games].sort((a,b)=> new Date(b.playedAt)-new Date(a.playedAt));
  if(filterYear!=='all') list = list.filter(g=> new Date(g.playedAt+'T00:00:00').getFullYear()===Number(filterYear));
  if(filterStatus!=='all') list = list.filter(g=> g.status===filterStatus);

  return `
  <div class="card">
    <h2>Game History</h2>
    <div class="filter-row">
      <select onchange="state.gamesFilterYear=this.value; render();">
        <option value="all">All years</option>
        ${years.map(y=>`<option value="${y}" ${String(y)===filterYear?'selected':''}>${y}</option>`).join('')}
      </select>
      <select onchange="state.gamesFilterStatus=this.value; render();">
        <option value="all">All statuses</option>
        <option value="scheduled" ${filterStatus==='scheduled'?'selected':''}>Scheduled</option>
        <option value="in_progress" ${filterStatus==='in_progress'?'selected':''}>In Progress</option>
        <option value="completed" ${filterStatus==='completed'?'selected':''}>Completed</option>
        <option value="cancelled" ${filterStatus==='cancelled'?'selected':''}>Cancelled</option>
      </select>
    </div>
    <div class="table-wrap">
    <table>
      <tr><th>Date</th><th>Players</th><th>Map</th><th>Winner</th><th>Score</th><th>Status</th><th></th></tr>
      ${list.length? list.map(g=>{
        const winner = g.status==='completed' ? [...g.players].sort((a,b)=>a.finishPos-b.finishPos)[0] : null;
        return `<tr>
          <td>${fmtDate(g.playedAt)}</td>
          <td>${g.players.length}</td>
          <td>${mapName(g.mapId)}</td>
          <td>${winner? playerName(winner.playerId) : '—'}</td>
          <td class="num">${winner? winner.finalScore : '—'}</td>
          <td><span class="pill ${g.status}">${g.status.replace('_',' ')}</span></td>
          <td class="btn-row">
            <button class="btn sm outline" onclick="openGameDetail('${g.id}')">Open</button>
            ${g.status==='in_progress' ? `<button class="btn sm" onclick="openGameForScoring('${g.id}')">Enter results</button>` : ''}
          </td>
        </tr>`;
      }).join('') : `<tr><td colspan="7" class="empty-state">No games match this filter.</td></tr>`}
    </table>
    </div>
  </div>`;
}

/* =========================================================
   GAME DETAIL (modal) — view / share / start / score / edit
========================================================= */
function openGameDetail(id, justCreatedScheduled){
  const g = games.find(x=>x.id===id);
  if(!g) return;
  state.detailGame = id;
  state.detailMode = 'view';
  showModal(renderGameDetail(g, {justCreatedScheduled}));
}
function openGameForScoring(id){
  const g = games.find(x=>x.id===id); if(!g) return;
  state.detailGame = id; state.detailMode = 'score';
  showModal(renderGameDetail(g, {}));
}
function refreshDetail(){
  const g = games.find(x=>x.id===state.detailGame);
  if(!g) { closeModal(); render(); return; }
  showModal(renderGameDetail(g, {}));
}

function renderGameDetail(g, opts){
  if(state.detailMode==='score') return renderScoringForm(g);
  if(state.detailMode==='rank') return renderRankingForm(g);
  if(state.detailMode==='editSetup') return renderEditSetup(g);
  const sorted = [...g.players].sort((a,b)=> (a.order||0)-(b.order||0));
  return `
    <div class="tag-row" style="justify-content:space-between;align-items:flex-start;">
      <div>
        <div class="eyebrow">${fmtDate(g.playedAt)}</div>
        <h2 style="margin-top:2px;">Game details <span class="pill ${g.status}">${g.status.replace('_',' ')}</span></h2>
      </div>
      <button class="btn sm outline" onclick="closeModal()">✕ Close</button>
    </div>

    <div class="table-wrap" style="margin:12px 0;">
    <table class="setup-table">
      <tr><th>Order</th><th>Player</th><th>Color</th><th>Leader</th>${g.status==='completed'?'<th>Score</th><th>Finish</th><th>Pts</th>':''}</tr>
      ${sorted.map(gp=>`<tr class="${g.status==='completed'&&gp.finishPos===1?'me-row':''}">
        <td>${gp.order}</td><td>${playerName(gp.playerId)}</td>
        <td><span class="swatch c-${gp.color}"></span> ${COLOR_LABEL[gp.color]}</td>
        <td>${leaderName(gp.leaderId)}</td>
        ${g.status==='completed'? `<td class="num"><strong>${gp.finalScore}</strong></td><td class="num">${gp.finishPos}</td><td class="num">${gp.leaguePoints}</td>` : ''}
      </tr>`).join('')}
    </table>
    </div>
    <p><strong>Board:</strong> ${mapName(g.mapId)} &nbsp;·&nbsp; <strong>Research Track:</strong> ${trackName(g.researchTrackId)}</p>

    ${(g.status==='scheduled') ? `
    <div class="divider"></div>
    <h3>Share with the group</h3>
    <div class="share-box" id="shareText">${escapeHtml(shareTextForGame(g))}</div>
    <div class="btn-row" style="margin-top:10px;">
      <button class="btn gold" onclick="shareWhatsApp('${g.id}')">🟢 Share on WhatsApp</button>
      <button class="btn outline" onclick="copyShare('${g.id}')">📋 Copy summary</button>
    </div>
    <p class="small muted" style="margin-top:8px;">Once this app is published to a stable link, the summary above will include a direct link to this game. Either way, everyone can also find it under the "Games" tab.</p>
    ` : ''}

    <div class="divider"></div>
    <div class="btn-row">
      ${g.status==='scheduled' ? `<button class="btn" onclick="startGame('${g.id}')">▶️ Start Game</button>` : ''}
      ${g.status==='in_progress' ? `<button class="btn" onclick="state.detailMode='score'; refreshDetail();">📝 Enter Results</button>` : ''}
      ${g.status==='completed' ? `<button class="btn outline" onclick="state.detailMode='score'; refreshDetail();">✏️ Edit results</button>` : ''}
      <button class="btn outline" onclick="openEditSetup('${g.id}')">🛠️ Edit setup</button>

function updateEditPlayer(pid, field, val){
  const gp = state.editBuffer.players.find(p=>p.playerId===pid);
  gp[field] = field==='order' ? Number(val) : (val || null);
}
async function saveSetupEdits(){
  const eb = state.editBuffer;
  const n = eb.players.length;
  const orders = eb.players.map(p=>Number(p.order));
  const uniqueOrders = new Set(orders);
  if(uniqueOrders.size!==n || Math.min(...orders)!==1 || Math.max(...orders)!==n){
    showAlert(`Player order must be unique numbers from 1 to ${n}.`); return;
  }
  const colors = eb.players.map(p=>p.color);
  if(new Set(colors).size!==colors.length){ showAlert('Each player needs a unique color.'); return; }
  const leaderVals = eb.players.map(p=>p.leaderId).filter(Boolean);
  if(new Set(leaderVals).size!==leaderVals.length){ showAlert('Each leader can only be assigned to one player.'); return; }

  const g = games.find(x=>x.id===eb.id);
  g.playedAt = eb.playedAt; g.mapId = eb.mapId; g.researchTrackId = eb.researchTrackId;
  eb.players.forEach(p=>{
    const gp = g.players.find(x=>x.playerId===p.playerId);
    gp.order = Number(p.order); gp.color = p.color; gp.leaderId = p.leaderId || null;
  });
  await saveGames();
  state.detailMode='view'; state.editBuffer=null;
  refreshDetail(); render();
}
function deleteGamePermanently(id){
  showConfirm('Permanently delete this game? This removes it from history and league totals and cannot be undone.', async ()=>{
    games = games.filter(x=>x.id!==id);
    await saveGames();
    closeModal();
  });
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function startGame(id){

function scoreCompositionData(period){
  const gs = completedGames(resolvePeriod(period));
  const map = {};
  gs.forEach(g=> g.players.forEach(gp=>{
    const s = map[gp.playerId] || (map[gp.playerId]={playerId:gp.playerId,n:0,research:0,temple:0,idol:0,guardian:0,card:0,fear:0,total:0});
    s.n++; s.research+=num(gp.researchVP); s.temple+=num(gp.templeVP); s.idol+=num(gp.idolVP);
    s.guardian+=num(gp.guardianVP); s.card+=num(gp.cardVP); s.fear+=num(gp.fearVP); s.total+=num(gp.finalScore);
  }));
  return Object.values(map).map(s=>({playerId:s.playerId, n:s.n,
    research:s.research/s.n, temple:s.temple/s.n, idol:s.idol/s.n,
    guardian:s.guardian/s.n, card:s.card/s.n, fear:s.fear/s.n, total:s.total/s.n }));
}

  const rows = scoreCompositionData(period).sort((a,b)=>b.total-a.total);

    ${rows.length? rows.map(r=>`<tr>
      <td>${playerName(r.playerId)}</td><td class="num">${r.n}</td>
      <td class="num">${r.research.toFixed(1)}</td><td class="num">${r.temple.toFixed(1)}</td><td class="num">${r.idol.toFixed(1)}</td>
      <td class="num">${r.guardian.toFixed(1)}</td><td class="num">${r.card.toFixed(1)}</td>
      <td class="num" style="color:var(--danger);">${r.fear.toFixed(1)}</td><td class="num"><strong>${r.total.toFixed(1)}</strong></td>
    </tr>`).join('') : `<tr><td colspan="9" class="empty-state">No data for this period yet.</td></tr>`}
  </table>
  </div>`;
}

function fairnessData(period){
  const gs = completedGames(resolvePeriod(period));
  const map = {};
  gs.forEach(g=> g.players.forEach(gp=>{
    const s = map[gp.playerId] || (map[gp.playerId]={playerId:gp.playerId,n:0,pos:{1:0,2:0,3:0,4:0},color:{red:0,yellow:0,green:0,blue:0},leader:{}});
    s.n++; s.pos[gp.order]=(s.pos[gp.order]||0)+1; s.color[gp.color]=(s.color[gp.color]||0)+1;
    const lk = gp.leaderId || 'none';
    s.leader[lk] = (s.leader[lk]||0)+1;
  }));
  return Object.values(map);
}
function renderFairness(period){
  const rows = fairnessData(period).sort((a,b)=>b.n-a.n);
  const pct = (v,n)=> n? (v/n*100).toFixed(0)+'%' : '—';
  const leaderIdsUsed = [...new Set(rows.flatMap(r=>Object.keys(r.leader)))]
    .sort((a,b)=> (a==='none'?1:0)-(b==='none'?1:0) || leaderName(a==='none'?null:a).localeCompare(leaderName(b==='none'?null:b)));
  return `
  <p class="muted small" style="margin-top:14px;">How evenly starting positions and colors have landed on each player — useful for spotting an unlucky streak.</p>
  <div class="table-wrap">
  <table>
    <tr><th>Player</th><th>Games</th><th>Pos 1</th><th>Pos 2</th><th>Pos 3</th><th>Pos 4</th><th>Red</th><th>Yellow</th><th>Green</th><th>Blue</th></tr>
    ${rows.length? rows.map(r=>`<tr>
      <td>${playerName(r.playerId)}</td><td class="num">${r.n}</td>
      <td class="num">${pct(r.pos[1],r.n)}</td><td class="num">${pct(r.pos[2],r.n)}</td><td class="num">${pct(r.pos[3],r.n)}</td><td class="num">${pct(r.pos[4],r.n)}</td>
      <td class="num">${pct(r.color.red,r.n)}</td><td class="num">${pct(r.color.yellow,r.n)}</td><td class="num">${pct(r.color.green,r.n)}</td><td class="num">${pct(r.color.blue,r.n)}</td>
    </tr>`).join('') : `<tr><td colspan="10" class="empty-state">No data for this period yet.</td></tr>`}
  </table>
  </div>

  <h3 style="margin-top:22px;">Leader distribution by player</h3>
  <p class="muted small">How many times each player has played each leader (or gone leaderless).</p>
  <div class="table-wrap">
  <table>
    <tr><th>Player</th><th>Games</th>${leaderIdsUsed.map(lid=>`<th>${lid==='none'?'No Leader':leaderName(lid)}</th>`).join('')}</tr>
    ${rows.length? rows.map(r=>`<tr>
      <td>${playerName(r.playerId)}</td><td class="num">${r.n}</td>
      ${leaderIdsUsed.map(lid=>`<td class="num">${r.leader[lid]||0}</td>`).join('')}
    </tr>`).join('') : `<tr><td colspan="${2+leaderIdsUsed.length}" class="empty-state">No data for this period yet.</td></tr>`}
  </table>
  </div>`;
}

function headToHeadData(pidA, pidB, period){
  const gs = completedGames(resolvePeriod(period)).filter(g=> g.players.some(p=>p.playerId===pidA) && g.players.some(p=>p.playerId===pidB));
  let aAbove=0,bAbove=0,ties=0,diffSum=0;
  gs.forEach(g=>{
    const a=g.players.find(p=>p.playerId===pidA), b=g.players.find(p=>p.playerId===pidB);
    if(a.finishPos<b.finishPos) aAbove++; else if(b.finishPos<a.finishPos) bAbove++; else ties++;
    diffSum += (num(a.finalScore)-num(b.finalScore));
  });
  const n=gs.length;
  return {games:n, aAbove, bAbove, ties, avgDiff: n? diffSum/n:0};
}
function renderHeadToHead(period){
  if(players.length<2) return `<div class="empty-state" style="margin-top:14px;">Add at least two players to compare head-to-head.</div>`;
  const pidA = state.h2hA || players[0].id;
  const pidB = state.h2hB || (players.find(p=>p.id!==pidA)||players[0]).id;
  const d = headToHeadData(pidA, pidB, period);
  return `
  <div class="grid cols-2" style="max-width:520px;margin-top:14px;">
    <div><label class="small">Player A</label><select onchange="state.h2hA=this.value; render();">
      ${players.map(p=>`<option value="${p.id}" ${pidA===p.id?'selected':''}>${p.name}</option>`).join('')}
    </select></div>
    <div><label class="small">Player B</label><select onchange="state.h2hB=this.value; render();">
      ${players.map(p=>`<option value="${p.id}" ${pidB===p.id?'selected':''}>${p.name}</option>`).join('')}
    </select></div>
  </div>
  ${pidA===pidB ? `<div class="empty-state">Pick two different players.</div>` : `
  <div class="grid cols-4" style="margin-top:14px;">
    <div class="card"><div class="eyebrow">Games together</div><div class="stat-big">${d.games}</div></div>
    <div class="card"><div class="eyebrow">${playerName(pidA)} finished above</div><div class="stat-big">${d.aAbove}</div></div>
    <div class="card"><div class="eyebrow">${playerName(pidB)} finished above</div><div class="stat-big">${d.bAbove}</div></div>
    <div class="card"><div class="eyebrow">Ties</div><div class="stat-big">${d.ties}</div></div>
  </div>
  <p class="muted small" style="margin-top:10px;">Avg score difference (${playerName(pidA)} − ${playerName(pidB)}): <strong>${d.avgDiff>=0?'+':''}${d.avgDiff.toFixed(1)}</strong></p>
  `}`;
}

function renderYoY(period){
  if(!players.length) return `<div class="empty-state" style="margin-top:14px;">Add players to see year-over-year trends.</div>`;
  const pid = state.yoyPlayer || players[0].id;

    <tr><th>Year</th><th>Games</th><th>Wins</th><th>Win%</th><th>Avg Score</th><th>Avg Finish</th><th>League Pts</th></tr>

function renderGroupTable(period, groupFn, label, fmt){
  const rows = groupStats(period, groupFn).sort((a,b)=> b.plays-a.plays);
  return `
  <div class="table-wrap" style="margin-top:14px;">

    <tr><th>${label}</th><th>Plays</th><th>Wins</th><th>Win%</th><th>Avg Score</th><th>Avg Finish</th></tr>

    : `<tr><td colspan="6" class="empty-state">No data for this period yet.</td></tr>`}

}

  </div>

    <h2>GitHub connection</h2>
    <p class="small">Data is stored as a JSON file in <strong>${escapeHtml(ghConfig?.owner||'')}/${escapeHtml(ghConfig?.repo||'')}</strong> (${escapeHtml(ghConfig?.path||'')}, branch ${escapeHtml(ghConfig?.branch||'')}). Every save is a git commit — you can view the full history, or revert a bad save, directly on GitHub.</p>
    <div class="btn-row">
      <button class="btn gold" onclick="copySetupLink()">🔗 Copy one-click setup link for your group</button>
      <button class="btn outline" onclick="renderGhSetup(ghConfig)">✏️ Edit connection</button>
      <button class="btn danger" onclick="disconnectGh()">Disconnect this browser</button>
    </div>
    <p class="small muted" style="margin-top:8px;">The setup link carries your full write-access token — share it privately with people you trust (a DM, not a public group), and treat it like a password.</p>
  </div>
  <div class="card" style="margin-top:16px;">
    <h2>Backup &amp; restore</h2>
    <p class="small">Export everything — players, games, settings and league history — to a file you keep. Handy before big changes, or for migrating to a different repo.</p>
    <div class="btn-row">
      <button class="btn outline" onclick="exportData()">⬇️ Export backup (JSON)</button>
      <button class="btn outline" onclick="document.getElementById('importFileInput').click()">⬆️ Import backup</button>
      <input type="file" id="importFileInput" accept=".json,application/json" style="display:none;" onchange="handleImportFile(this)">
    </div>
  </div>
  <div class="card" style="margin-top:16px;">
    <h2>About this data</h2>
    <p class="small">Everyone who connects their browser to the same GitHub repo (Settings → GitHub connection) sees and edits the same players, games and league. There is no login beyond the token itself.</p>

}
function exportData(){
  const payload = JSON.stringify({ exportedAt: new Date().toISOString(), players, games, settings }, null, 2);
  const blob = new Blob([payload], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `arnak-tracker-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function handleImportFile(input){
  const file = input.files[0]; if(!file) return;
  let data;
  try{ data = JSON.parse(await file.text()); }
  catch(e){ showAlert('That file is not valid JSON.'); input.value=''; return; }
  if(!Array.isArray(data.players) || !Array.isArray(data.games)){
    showAlert("This file doesn't look like an Arnak Tracker backup."); input.value=''; return;
  }
  showConfirm(
    `This will replace ALL current data in this app with the backup (${data.players.length} players, ${data.games.length} games). This cannot be undone. Continue?`,
    async ()=>{
      players = data.players;
      games = data.games;
      settings = Object.assign(
        {expansions:{leaders:true,missing:false,twisted:false}, points:{1:5,2:3,3:2,4:1}, variants:{prospector:false,traveler:false}},
        data.settings||{}
      );
      await savePlayers(); await saveGames(); await saveSettings();
      input.value='';
      render();
      showAlert('Backup restored.');
    },
    ()=>{ input.value=''; }
  );
}
async function toggleExpansion(key){
  settings.expansions[key] = !settings.expansions[key];
  await saveSettings(); render();
}
async function toggleVariant(key){
  settings.variants[key] = !settings.variants[key];
  await saveSettings(); render();
}
async function setPoints(pos, val){
  settings.points[pos] = Number(val)||0;
  await saveSettings();
}

function showModal(html){
  document.getElementById('modalRoot').innerHTML = `<div class="modal-bg" onclick="if(event.target===this) closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; state.detailGame=null; state.detailMode='view'; render(); }

/* =========================================================
   IN-APP DIALOGS
   Claude's artifact sandbox blocks the browser's native confirm()/alert()/
   prompt() (they silently return false/null), so every yes/no or text-entry
   prompt in this app uses these instead. They layer above any open modal.
========================================================= */
function showConfirm(message, onYes, onNo){
  const wrap = document.createElement('div');
  wrap.className = 'modal-bg'; wrap.style.zIndex = '200';
  wrap.innerHTML = `<div class="modal" style="max-width:380px;">
    <p style="margin-top:0;">${escapeHtml(message)}</p>
    <div class="btn-row" style="justify-content:flex-end;">
      <button class="btn outline" id="dlgNo">Cancel</button>
      <button class="btn danger" id="dlgYes">Confirm</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  const cleanup = ()=> wrap.remove();
  wrap.querySelector('#dlgNo').onclick = ()=>{ cleanup(); if(onNo) onNo(); };
  wrap.querySelector('#dlgYes').onclick = ()=>{ cleanup(); onYes(); };
  wrap.addEventListener('click', e=>{ if(e.target===wrap){ cleanup(); if(onNo) onNo(); } });
}
function showAlert(message){
  const wrap = document.createElement('div');
  wrap.className = 'modal-bg'; wrap.style.zIndex = '200';
  wrap.innerHTML = `<div class="modal" style="max-width:380px;">
    <p style="margin-top:0;">${escapeHtml(message)}</p>
    <div class="btn-row" style="justify-content:flex-end;">
      <button class="btn gold" id="dlgOk">OK</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  const cleanup = ()=> wrap.remove();
  wrap.querySelector('#dlgOk').onclick = cleanup;
  wrap.addEventListener('click', e=>{ if(e.target===wrap) cleanup(); });
}
function showPrompt(message, defaultValue, onSubmit){
  const wrap = document.createElement('div');
  wrap.className = 'modal-bg'; wrap.style.zIndex = '200';
  wrap.innerHTML = `<div class="modal" style="max-width:380px;">
    <p style="margin-top:0;">${escapeHtml(message)}</p>
    <input type="text" id="dlgInput" value="${escapeHtml(defaultValue||'')}" style="margin-bottom:12px;">
    <div class="btn-row" style="justify-content:flex-end;">
      <button class="btn outline" id="dlgNo">Cancel</button>
      <button class="btn gold" id="dlgYes">Save</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  const input = wrap.querySelector('#dlgInput');
  setTimeout(()=>{ input.focus(); input.select(); }, 0);
  const cleanup = ()=> wrap.remove();
  const submit = ()=>{ const v=input.value; cleanup(); onSubmit(v); };
  wrap.querySelector('#dlgNo').onclick = cleanup;
  wrap.querySelector('#dlgYes').onclick = submit;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  wrap.addEventListener('click', e=>{ if(e.target===wrap) cleanup(); });
}

function bindTabEvents(){ /* reserved for future delegated events */ }

/* =========================================================
   ROUTING (deep link to a specific game via #/game/id)
========================================================= */
function handleHash(){
  const h = location.hash;
  const m = h.match(/^#\/game\/(.+)$/);
  if(m){
    const id = m[1];
    if(games.find(g=>g.id===id)) openGameDetail(id);
  }
}

========================================================= */
(async function init(){
  await loadAll();
  if(ghConfig){
    render();
    handleHash();
    window.addEventListener('hashchange', handleHash);
  }
  // if ghConfig is still null, loadAll() already rendered the setup screen —
  // the app proper starts once submitGhSetup() succeeds and calls render().
})();
